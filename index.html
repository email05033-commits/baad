<!--
==========================================================================
 預立化身處置委託申請 — 互動 prototype（v1，簡單樣式）
--------------------------------------------------------------------------
 給工程師的說明
 1. 單一 HTML 檔，無外部相依。狀態全部在 `state` 物件裡（見下方 JS）。
 2. 草稿：填寫中的內容存在 localStorage `avatarForm.draft`，重新整理不會遺失。
 3. 送出：submitForm() → buildRecord() 產生一筆紀錄，然後
      a. 存入 localStorage `avatarForm.submissions`（陣列）
      b. 若 CONFIG.SHEETS_ENDPOINT 有填，同時 POST 到 Google Apps Script
 4. 換下一位參與者：送出後重新整理頁面，即回到封面並產生新的化身登記編號。
 5. 管理頁：網址後面加 #admin，可檢視所有本機紀錄、匯出 CSV / JSON。
 6. 欄位定義見 RECORD_FIELDS（欄位 key ↔ 中文欄名）。

 Google 試算表設定（選配）
   (1) 開一個 Google 試算表 → 擴充功能 → Apps Script，貼上：

       function doPost(e) {
         var lock = LockService.getScriptLock();          // 多人同時送出時依序寫入
         lock.waitLock(10000);
         try {
           var sh = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
           var row = JSON.parse(e.postData.contents);     // { 中文欄名: 值, ... }
           if (sh.getLastRow() === 0) sh.appendRow(Object.keys(row));
           var header = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0];
           sh.appendRow(header.map(function (k) { return row[k] == null ? '' : row[k]; }));
           return ContentService.createTextOutput('ok');
         } finally {
           lock.releaseLock();
         }
       }

   (2) 部署 → 新增部署作業 → 類型「網頁應用程式」
       執行身分：我；誰可以存取：所有人 → 部署 → 授權（若出現「Google 尚未驗證
       這個應用程式」，點「進階」→「前往（不安全）」）→ 複製「網頁應用程式」網址
   (3) 把網址貼到下方 CONFIG.SHEETS_ENDPOINT 的引號中，存檔
   (4) 修改 Apps Script 後須「管理部署作業」→ 編輯 → 版本選「新版本」再部署，網址不變
==========================================================================
-->

  :root {
    --bg: #ffffff;
    --ink: #29282f;       /* 取自標誌色 */
    --ink2: #3f3e44;
    --mute: #6e6d73;
    --line: #c4c3c8;
    --hair: #e0dfe2;      /* 細分隔線 */
    --rule: #b9b8bd;      /* 主要分隔線（1.5px） */
    --ctl: #8f8e94;       /* 表單控制項外框：底線、圓點、勾選框、次要按鈕 */
    --radius: 4px;        /* 方形元素的小圓角 */
    --ph-no-weight: 300;  /* 頁面大數字粗細：300 細／700 粗 */
    --mod: #4f7894;       /* 另有意見：藍灰 */
    --err: #b3261e;
    --sans: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "TCSans", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    --mono: "Plex Mono", "SF Mono", Menlo, Consolas, "PingFang TC", "TCSans", "Noto Sans TC", monospace;
    --display: "Bree Serif", var(--sans);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans); color: var(--ink); background: var(--bg);
    font-size: 16px; line-height: 1.85; letter-spacing: .03em; -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  b, strong { font-weight: 600; }
  ::selection { background: var(--ink); color: #fff; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header.top {
    background: var(--bg); padding: 0 32px 0 24px; height: 72px;
    display: flex; align-items: center; gap: 14px;
  }
  header.top h1 { font-size: 15px; font-weight: 500; margin: 0; white-space: nowrap; letter-spacing: .14em;
                  padding-left: 14px; border-left: 1px solid var(--rule); line-height: 1; color: var(--ink2); }
  .progress { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
  .progress .label { font-family: var(--mono); font-size: 14px; color: var(--mute); white-space: nowrap; letter-spacing: .12em; }
  .progress .label b { color: var(--ink); font-weight: 400; }
  .progress .bar { width: 180px; height: 4px; background: var(--hair); position: relative; border-radius: 2px; overflow: hidden; }
  .progress .bar span { position: absolute; left: 0; top: 0; height: 4px; background: var(--ink); transition: width .4s ease; }
  .top .id-chip { font-family: var(--mono); font-size: 13px; color: var(--mute); letter-spacing: .1em; white-space: nowrap; }
  .top .id-chip { margin-left: 6px; }   /* 進度與編號之間維持原本 20px */
  .top .id-chip .no { letter-spacing: 0; margin-right: 4px; }   /* 等寬字的句點本身已佔一格，不再加空格 */

  /* 頁首標誌：可點擊回首頁 */
  .brand-home { border: 0; background: none; padding: 4px 6px; margin: 0 0 0 -6px; cursor: pointer; border-radius: var(--radius); text-align: left; }
  .brand-home:hover .logo { opacity: .7; }
  .brand-home:focus-visible { outline: 1px solid var(--ctl); outline-offset: 2px; }
  /* 確認框 */
  .dlg-scrim { position: fixed; inset: 0; background: rgba(255,255,255,.75); backdrop-filter: blur(2px); display: grid; place-items: center; z-index: 20; }
  .dlg-scrim[hidden] { display: none; }
  .dlg { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 28px 32px 24px; width: min(420px, 90vw); box-shadow: 0 12px 32px rgba(0,0,0,.08); }
  .dlg h2 { font-size: 18px; font-weight: 600; margin: 0 0 8px; letter-spacing: .06em; }
  .dlg p { margin: 0; color: var(--ink2); font-size: 15px; }
  .dlg-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
  /* 單位標誌 */
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand .logo { height: 22px; width: auto; object-fit: contain; display: block; flex: none; }
  .brand.full { gap: 0; }
  .brand.full .logo { height: 42px; }
  .brand.full .org { border-left: 1px solid var(--rule); margin-left: 24px; padding-left: 24px; height: 42px;
                     display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .brand.full .org .org-en { height: 12px; width: auto; display: block; }
  .brand.full .org b { line-height: 1.2; font-size: 17px; letter-spacing: .2em; font-weight: 500; }
  .brand .logo-ph { height: 36px; width: 36px; display: grid; place-content: center; border: 1px dashed var(--mute); font-size: 8px; color: var(--mute); border-radius: 50%; }
  .brand .org { display: flex; flex-direction: column; line-height: 1.4; min-width: 0; }
  .brand .org b { font-size: 15px; font-weight: 500; white-space: nowrap; letter-spacing: .14em; line-height: 1; }
  header.top .brand { gap: 0; }
  header.top .brand .org { border-left: 1px solid var(--rule); margin-left: 14px; padding-left: 14px; }
  .brand .org small { font-family: var(--mono); font-size: 10px; color: var(--mute); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .brand .org .ph-text { color: var(--mute); font-weight: 400; }

  .body { display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  /* 目錄：一條貫穿上下的細線（與頁首橫線交叉） */
  nav.toc { overflow-y: auto; padding: 60px 0 24px;   /* 第一項與頁面標題同高 */
            background: linear-gradient(var(--rule), var(--rule)) 27px 66px / 1px 100% no-repeat local, var(--bg); }   /* 直線從第一項上方一點開始 */
  .app.no-toc .body { grid-template-columns: 1fr; }
  .app.no-head { grid-template-rows: 1fr; }
  .app.no-head header.top { display: none; }
  .app.no-toc nav.toc { display: none; }
  main { overflow-y: auto; padding: 64px 72px 112px clamp(104px, 9vw, 144px); }   /* 左側多留白，與目錄拉開距離 */
  .page { max-width: 720px; margin: 0 auto; }

  /* ---------- TOC ---------- */
  .toc h2 { display: flex; align-items: center; gap: 14px; margin: 0 0 32px; padding-left: 11px;
            font-size: 13px; color: var(--ink2); font-weight: 500; letter-spacing: .2em; }
  .toc h2 .pill { background: var(--ink); color: #fff; border-radius: 999px; width: 33px; line-height: 22px; text-align: center; letter-spacing: .04em; font-size: 13px; font-family: var(--mono); font-weight: 400; }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc .item {
    display: grid; grid-template-columns: 15px 34px 1fr auto; align-items: center; column-gap: 12px;
    width: 100%; text-align: left; border: 0; background: none; position: relative;
    padding: 11px 20px; color: var(--ink); cursor: default; font-size: 15px; line-height: 1.5;
  }
  .toc .item:not(.clickable):focus { outline: none; }
  .toc .item.clickable { cursor: pointer; }
  .toc .item.clickable:hover .ttl { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .toc .item .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); justify-self: center; }
  .toc .item .num { font-family: var(--mono); font-size: 13px; color: var(--ink2); text-align: center; line-height: 22px; letter-spacing: .04em; }
  .toc .item .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toc .item .tag { font-size: 12px; color: var(--mute); white-space: nowrap; }
  /* 未填：較淺灰、空心點（對比約 4.3:1，仍易讀） */
  .toc .steps > li > .item:not(.done):not(.current) { color: #7a797f; }
  .toc .steps > li > .item:not(.done):not(.current) .num { color: #7a797f; }
  .toc .steps > li > .item:not(.done):not(.current) .dot { background: var(--bg); border: 1px solid var(--ctl); }
  /* 已填：深灰、中等粗細、實心點 */
  .toc .item.done { color: var(--ink2); font-weight: 500; }
  .toc .item.done .num { color: var(--ink2); }
  .toc .item.done .dot { background: var(--ink2); }
  .toc .item.skipped { color: #a3a2a7; }
  .toc .item.skipped .dot { border-style: dashed !important; border-color: #bbb !important; }
  .toc .item.current { font-weight: 600; }
  .toc .item.current .num { background: var(--ink); color: #fff; border-radius: 999px; }
  .toc .sub { padding: 0 0 10px; }
  .toc .sub .item { grid-template-columns: 1fr auto; padding: 4px 20px 4px 56px; font-size: 14px; color: var(--ink2); }
  /* 條款：從目錄直線分出的短橫線，取代編號 */
  .toc .sub .item::before { content: ""; position: absolute; left: 28px; top: 50%; width: 8px; height: 1px; background: var(--line); transition: width .15s, background .15s; }
  .toc .sub .item .tag.mod { color: var(--mod); }
  .toc .sub .item .tag.warn { color: var(--err); }
  .toc .sub .item.inview { color: var(--ink); font-weight: 600; }
  .toc .sub .item.inview::before { width: 20px; background: var(--ink); }
  .toc hr { border: 0; border-top: 1px solid var(--hair); margin: 20px 20px 8px 44px; }
  .toc .item.law-link .ttl { grid-column: 2 / 4; padding-left: 9px; }
  .toc .item.law-link { font-size: 14px; font-weight: 600; color: #57565c; }   /* 附加連結：略小、加粗、深灰 */   /* 齊左對齊上方步驟編號 */
  .toc .item.law-link .tag { color: #57565c; font-family: var(--mono); font-weight: 400; }

  /* ---------- 頁首：編號＋雙語標題 ---------- */
  .ph { margin: 0 0 56px; display: flex; align-items: flex-end; gap: 24px; }
  /* 內文左緣對齊大數字的實際筆畫（字型左側自帶約 0.08em 空隙） */
  .page .ph ~ * { margin-left: .5em !important; }
  /* 大數字：底部與標題底部對齊 */
  .ph-no { font-family: var(--sans); font-size: 88px; line-height: .74; font-weight: var(--ph-no-weight); letter-spacing: -.01em; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
  .ph-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 14px; color: var(--mute);
            letter-spacing: .1em; padding-bottom: 32px; }
  .ph-row b { color: var(--ink); font-weight: 400; }
  .ph h2, .page .ph h2 { font-size: 32px; font-weight: 600; letter-spacing: .08em; line-height: 1; margin: 0 0 1px; text-align: left; }
  .ph-en { font-family: var(--display); font-size: 16px; color: var(--ink2); margin: 8px 0 0 4em; letter-spacing: .02em; }

  /* ---------- content：無卡片，以細線分段 ---------- */
  .page h2 { font-size: 26px; font-weight: 600; margin: 8px 0 24px; letter-spacing: .08em; }
  .page h3 { font-size: 17px; font-weight: 600; margin: 36px 0 10px; letter-spacing: .08em; }
  .req { color: var(--err); font-size: 13px; font-weight: 400; }
  .opt { color: var(--mute); font-size: 13px; font-weight: 400; letter-spacing: .1em; }
  .card { border-top: 1px solid var(--hair); padding: 32px 0 36px; margin: 0; position: relative; }
  .lead + .card { border-top: 1px solid var(--rule); }   /* 說明文字與第一條條款之間保留分隔 */
  .ph + .card, .ph + .errors + .card { border-top: 0; padding-top: 0; }   /* 標題下不加線，直接接內容 */
  .card > h3:first-child { margin-top: 0 !important; }
  .card.invalid, .invalid-box { box-shadow: inset 2px 0 0 var(--err); padding-left: 22px !important; }
  .muted { color: var(--mute); }
  .small { font-size: 14px; }
  .eyebrow { font-size: 13px !important; font-weight: 500 !important; letter-spacing: .24em !important; color: var(--ink); margin: 0 0 4px !important; }
  .eyebrow span { font-family: var(--mono); color: var(--mute); font-weight: 400; margin-left: 12px; letter-spacing: .2em; }
  .ni { display: flex; margin: 4px 0; }
  .ni .nm { flex: none; white-space: nowrap; color: var(--ink2); }
  .ni .nt { flex: 1; min-width: 0; }

  /* 時間軸編號列表（封面注意事項） */
  ol.tl { list-style: none; margin: 0; padding: 0; }
  ol.tl li { display: grid; grid-template-columns: 28px 1fr; column-gap: 14px; align-items: baseline; padding: 8px 0; }
  ol.tl .tl-t { font-size: 14px; }
  ol.tl .tl-no { font-family: var(--mono); font-size: 13px; color: var(--ink2); letter-spacing: .04em; }

  .field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
  .field label.lbl { min-width: 8em; font-size: 15px; color: var(--ink2); letter-spacing: .12em; }
  input[type=text], input[type=number], select {
    border: 0; border-bottom: 1px solid var(--ctl); border-radius: 0; padding: 6px 2px; background: transparent; outline: none;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus { border-bottom: 2px solid var(--ink); padding-bottom: 5px; }
  input[type=number] { font-family: var(--mono); }
  select { padding-right: 4px; cursor: pointer; font-family: var(--mono); }
  textarea { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: transparent; outline: none;
             width: 100%; min-height: 104px; resize: vertical; margin-top: 10px; line-height: 1.8; }
  textarea:focus { border-color: var(--ink); }
  ::placeholder { color: #8e8d92; }
  input.invalid, select.invalid { border-bottom-color: var(--err); }
  textarea.invalid { border-color: var(--err); }
  input[readonly] { border-bottom: 0; padding-left: 0; pointer-events: none; color: var(--ink2); font-family: var(--mono); font-size: 15px; letter-spacing: .06em; }

  input[type=radio], input[type=checkbox] {
    appearance: none; -webkit-appearance: none; flex: none;
    width: 16px; height: 16px; margin: 0 12px 0 0; border: 1px solid var(--ctl); border-radius: 50%;
    background: transparent; display: inline-grid; place-content: center; cursor: pointer;
    vertical-align: top; margin-top: calc((1.85em - 16px) / 2);   /* 置中於該行，與中文字對齊 */
  }
  input[type=radio]::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); transform: scale(0); transition: transform .15s; }
  input[type=radio]:checked::before { transform: scale(1); }
  input[type=checkbox] { border-radius: 3px; }
  input[type=radio]:checked { border-color: var(--ink); }
  input[type=checkbox]:checked { border-color: var(--ink); }
  input[type=checkbox]::before { content: ""; width: 8px; height: 4px; border: solid #fff; border-width: 0 0 1.5px 1.5px; transform: rotate(-45deg) scale(0); margin-top: -2px; transition: transform .15s; }
  input[type=checkbox]:checked { background: var(--ink); }
  input[type=checkbox]:checked::before { transform: rotate(-45deg) scale(1); }
  input[type=radio]:focus-visible, input[type=checkbox]:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  .choice { display: block; margin: 10px 0; cursor: pointer; padding-left: 28px; text-indent: -28px; }   /* 換行時對齊文字，不跑到圓點下方 */
  .choice > * { text-indent: 0; }
  .choice.agree { padding-left: 0; text-indent: 0; }
  .choice input[type=number] { margin: 0 4px; }
  .choice:has(input[type=number]) > input[type=radio] { vertical-align: middle; margin-top: -3px; }   /* 含年數欄的選項，圓點與文字對齊 */
  .indent { margin-left: 7px; padding: 6px 0 6px 28px; border-left: 1px solid var(--hair); }
  .law-note { padding-top: 0 !important; }
  .law-note p { margin: 0 0 2px; }
  .law-note .ni { margin: 0; }
  /* 選「同意預設條款」時，意見框淡化（內容保留但不會送出） */
  .opinion-box textarea { transition: opacity .15s; }
  .art-card:has(input[value=default]:checked) .opinion-box textarea { opacity: .45; }
  .art-note { margin: -8px 0 18px; }
  .art-note.free { margin: 18px 0 12px; }   /* 第十條：標題下方的 ※ 注釋，與標題拉開距離（只在填寫頁顯示） */
  .art-note { line-height: 1.75; }
  .nw { white-space: nowrap; }   /* 不拆開的詞（注釋以「化身／監護人／決定。」為單位換行） */
  .dr-note { margin: -4px 0 12px !important; padding-left: 28px; }   /* 04 除籍下方 ※ 注釋：對齊選項文字（只在填寫頁顯示） */
  .default-box { border-left: 1.5px solid var(--rule); padding: 2px 0 2px 18px; margin: 14px 0 22px; color: var(--ink2); }
  .default-box b { display: block; font-size: 13px; font-weight: 500; letter-spacing: .14em; color: var(--mute); margin-bottom: 4px; }
  .linklike { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px;
              text-decoration-thickness: 1px; cursor: pointer; }
  .linklike:hover { text-decoration-thickness: 2px; }

  /* 第三章：左欄大號條次 */
  .card.art-card { display: block; }
  .art-card .art-label { display: block; font-size: 13px; letter-spacing: .2em; color: var(--mute); margin-bottom: 4px; }
  .art-card h3 { margin: 0 0 4px !important; font-size: 19px; }
  /* 諮商建議：條款標題右側的小按鈕與彈出視窗 */
  .art-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .adv-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; margin-bottom: 2px;
    border: 1px solid var(--line); border-radius: 16px; background: none; color: var(--ink2); font-size: 13px; letter-spacing: .08em; cursor: pointer; }
  .adv-btn:hover { border-color: var(--ctl); color: var(--ink); }
  .adv-btn:focus-visible { outline: 1px solid var(--ctl); outline-offset: 2px; }
  .dlg.adv { position: relative; width: min(560px, 92vw); max-height: 86vh; overflow-y: auto; padding: 30px 36px 26px; }
  .dlg.adv .adv-x { position: absolute; top: 22px; right: 22px; margin: 0; }   /* 與上緣、右緣距離相同 */
  .adv-eyebrow { display: block; font-size: 12px; letter-spacing: .24em; color: var(--mute); margin-bottom: 6px; }
  .dlg.adv h2 { font-size: 20px; margin: 0 0 14px; padding-right: 36px; }
  .dlg.adv h2 .n { font-size: 13px; font-weight: 400; color: var(--mute); letter-spacing: .14em; margin-right: 12px; }
  .dlg.adv .adv-lead { margin: 0 0 8px; }
  .adv-q { margin: 0; padding: 0; list-style: none; counter-reset: q; }
  .adv-q li { counter-increment: q; display: grid; grid-template-columns: 28px 1fr; padding: 10px 0; border-top: 1px solid var(--hair); color: var(--ink); line-height: 1.75; }
  .adv-q li:first-child { border-top: 0; }
  .adv-q li::before { content: counter(q, decimal-leading-zero); font-family: var(--mono); font-size: 12px; color: var(--mute); padding-top: 3px; }
  .adv-ref { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .adv-ref > span { color: var(--mute); font-size: 13px; letter-spacing: .12em; margin-right: 4px; }
  aside.law h4.hl { background: #f1f0f3; transition: background .4s; }
  /* 想一想：跑馬燈（本局近期受理之另有意見） */
  .adv-mq { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .adv-mq-t { display: block; font-size: 13px; letter-spacing: .12em; color: var(--mute); margin-bottom: 8px; }
  .mq { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
  .mq-track { display: flex; width: max-content; animation: mq linear infinite; }
  .mq:hover .mq-track, .mq:active .mq-track { animation-play-state: paused; }
  .mq-i { white-space: nowrap; font-size: 15px; color: var(--ink2); padding: 0 18px; position: relative; }
  .mq-i::after { content: ""; position: absolute; right: 0; top: 50%; width: 1px; height: 12px; margin-top: -6px; background: var(--line); }
  @keyframes mq { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {   /* 減少動態效果：改成靜態換行 */
    .mq { -webkit-mask-image: none; mask-image: none; }
    .mq-track { animation: none; width: auto; flex-wrap: wrap; gap: 4px 22px; }
    .mq-i { padding: 0; } .mq-i::after { display: none; }
    .mq-track > .mq-i:nth-child(n+11) { display: none; }
  }
  .adv-mq + .adv-ref { border-top: 0; margin-top: 6px; }

  /* 沒有中文粗體的裝置：用細描邊模擬（只套在粗體的地方） */
  .no-cjk-bold :is(b, strong, h1, h2, h3, h4, .art-t) { -webkit-text-stroke: .045em currentColor; }
  .no-cjk-bold :is(h1, h2, h3, h4) :is(.n, .opt, .optl) { -webkit-text-stroke: 0; }
  .scrim { z-index: 25; } aside.law { z-index: 30; }   /* 條例面板疊在諮商建議視窗之上，關閉後回到建議 */
  @media (max-width: 600px) {
    .adv-btn { height: 30px; padding: 0 10px; margin-bottom: 6px; }
    .dlg.adv { padding: 26px 22px 22px; }
    .dlg.adv .adv-x { top: 18px; right: 18px; }
    .dlg.adv h2 { font-size: 17px; margin-bottom: 12px; }
    .art-note.free { margin-top: 24px; }
  }
  .lead { color: var(--ink2); margin: 0 0 32px; }
  .lead b { color: var(--ink); }

  .person { border-top: 1px solid var(--hair); padding: 12px 0 4px; }
  .person .ord .mk { display: inline-block; width: 8px; height: 8px; background: var(--ink); border-radius: 2px; margin-right: 12px; vertical-align: 2px; }
  .person .ord { font-size: 15px; letter-spacing: .08em; font-weight: 500; }
  .person .ord .n { display: inline-block; min-width: 30px; text-align: center; background: var(--ink); color: #fff; font-family: var(--mono);
                    border-radius: 999px; font-size: 13px; line-height: 22px; margin-right: 10px; font-weight: 400; }

  .errors { border-left: 2px solid var(--err); border-radius: 2px; color: #8a1d17; padding: 4px 0 4px 20px; margin-bottom: 40px; font-size: 15px; }
  .errors ul { margin: 6px 0 0; padding-left: 1.2em; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
  .btn { border: 1px solid var(--ctl); background: transparent; color: var(--ink); height: 40px; padding: 0 22px; line-height: 38px; border-radius: 999px;
         cursor: pointer; font-size: 15px; letter-spacing: .12em; transition: background .15s, color .15s; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  /* 幾何三角形箭頭（以 CSS 繪製，不受字型影響） */
  .tri, .btn[data-act=confirm]::after, .btn[data-act=start]::after, .btn[data-act=prev]::before {
    content: ""; display: inline-block; width: 0; height: 0; vertical-align: 1px;
    border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; border-left: 7px solid currentColor;
  }
  .btn[data-act=confirm]::after, .btn[data-act=start]::after { margin-left: 14px; }
  .btn[data-act=prev]::before { margin-right: 14px; border-left: 0; border-right: 7px solid currentColor; }
  .tri.l { border-left: 0; border-right: 7px solid currentColor; }
  .tri.d { border: 0; border-left: 4.5px solid transparent; border-right: 4.5px solid transparent; border-top: 7px solid currentColor; vertical-align: 2px; transition: transform .15s; }
  .def-toggle[aria-expanded=true] .tri.d { transform: rotate(180deg); }
  .tag .tri { margin-left: 4px; }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:not(:disabled):hover { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:not(:disabled):hover { background: #111016; }

  /* ---------- 確認送出 ---------- */
  /* 確認送出：每段一張細框卡片（白底、小圓角） */
  .card.review, .lead + .card.review, .muted + .card.review, .page > .card.review:first-of-type {
    border: 1px solid var(--line); border-radius: 6px; padding: 22px 28px 26px; margin: 0 0 20px; }
  .card.review.invalid-box { border-color: var(--err); }
  .card.review + .card:not(.review) { border-top: 0; padding-top: 16px; }   /* 卡片後的同意勾選不再加線 */
  .review dl { display: grid; grid-template-columns: 11em 1fr;   /* 固定標籤欄寬，各段的內容欄對齊 */ gap: 8px 12px; margin: 20px 0 0; }
  .review dt { color: var(--mute); white-space: nowrap; padding-right: 16px; font-size: 15px; letter-spacing: .1em; padding-top: 1px; }
  .review dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .review .art { padding: 12px 0; border-top: 1px solid var(--hair); }
  .review .head + .art { border-top: 0; margin-top: 8px; }
  .review .art-head { display: flex; gap: 16px; align-items: baseline; }
  .review .def-toggle { margin-left: auto; background: none; border: 0; padding: 0; color: var(--mute); font-size: 13px; cursor: pointer; white-space: nowrap; letter-spacing: .08em; }
  .review .def-toggle:hover { color: var(--ink); text-decoration: underline; }
  .review .def-text { margin: 6px 0 0; font-size: 14px; color: var(--mute); line-height: 1.8; border-left: 1.5px solid var(--rule); padding-left: 14px; }
  .review .art-t { color: var(--mute); font-size: 15px; font-weight: 600; white-space: nowrap; }
  .review .art-t .n { font-weight: 400; }
  .review .art-t .n { color: var(--mute); margin-right: 12px; font-size: 13px; letter-spacing: .1em; }
  .review .st { font-size: 13px; color: var(--mute); letter-spacing: .06em; }
  .review .st.mod { color: var(--mod); }
  .review .opinion { margin: 8px 0 2px; padding: 2px 0 2px 14px; border-left: 2px solid var(--mod); color: var(--ink);
                     white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  .review .head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0; }
  .review .head h3 { margin: 0; }
  .edit-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
              border: 1px solid transparent; border-radius: 50%; background: none; color: var(--ink); cursor: pointer; }
  .edit-btn:hover { border-color: var(--ctl); }
  .agree { font-size: 15px; display: flex !important; align-items: flex-start; }
  .agree input { margin-top: calc((1.85em - 16px) / 2); }

  /* ---------- 封面 / 完成頁：留白＋十字對位標記 ---------- */
  .sheet { position: relative; max-width: 720px; margin: 0 auto; padding: 40px 48px 48px; }
  .sheet.cover { max-width: 960px; }   /* 封面較寬，不必與填寫頁同寬 */
  .app.no-head .page { max-width: 1240px; }
  /* ---------- 首頁：左標誌、右內容，兩塊等高（上緣、下緣對齊），畫面上下置中 ---------- */
  .cover2 { min-height: calc(100vh - 176px); display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
            grid-template-rows: auto auto; column-gap: clamp(48px, 7vw, 104px); align-content: center; align-items: stretch; }
  .c-brand { grid-column: 1; grid-row: 1; width: 100%; justify-self: end; align-self: start; }   /* 寬度由 fitCoverBrand() 依右欄高度計算 */
  .c-home { cursor: pointer; transition: opacity .15s; }
  .c-home:hover { opacity: .7; }
  .c-home:focus-visible { outline: 1px solid var(--ctl); outline-offset: 8px; border-radius: var(--radius); }
  .c-mark { display: block; width: 100%; height: auto; }
  .c-org { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .c-org b { font-size: clamp(15px, 1.45vw, 21px); font-weight: 600; letter-spacing: .22em; white-space: nowrap; line-height: 1; }
  .c-org .sep { width: 1.5px; height: 1.3em; background: var(--rule); flex: none; font-size: clamp(15px, 1.45vw, 21px); }
  .c-org img { flex: 1; min-width: 0; height: auto; display: block; }
  /* 右欄：標題貼齊 LOGO 頂端、注意事項貼齊局名底部 */
  .c-main { grid-column: 2; grid-row: 1; max-width: 560px; display: flex; flex-direction: column; justify-content: space-between; }
  .c-main h2 { font-size: clamp(30px, 2.9vw, 42px); font-weight: 600; letter-spacing: .1em; line-height: 1.2; margin: -4px 0 0; }
  .c-sub { font-size: 15px; color: var(--mute); letter-spacing: .12em; margin: 10px 0 0; line-height: 1.6; }
  .cover2 .cover-notes { margin-top: 20px; padding-top: 16px; }
  .cover2 ol.tl li { padding: 4px 0; }
  .cover2 ol.tl li:last-child { padding-bottom: 0; }
  .cover2 .eyebrow { margin-bottom: 2px !important; }
  /* 完成頁：登記編號（標籤在上、編號在下，不加線） */
  .done2 .c-sub { color: var(--ink2); line-height: 1.8; letter-spacing: .04em; }
  .d-id { margin-top: 32px; }
  .d-id span { display: block; font-size: 13px; color: var(--mute); letter-spacing: .14em; }
  .d-id code { display: block; font-family: var(--mono); font-size: 30px; letter-spacing: .06em; color: var(--ink); line-height: 1.3; margin-top: 4px; }
  .d-id small { display: block; font-size: 14px; margin-top: 8px; }
  .d-id small.st-busy { color: var(--err); }
  .d-id small.st-ok { color: #2f7a4b; }       /* 成功：沉穩的綠，與白底對比足夠 */
  .d-id small.st-fail { color: var(--err); font-weight: 600; }
  .c-actions { grid-column: 2; grid-row: 2; max-width: 560px; display: flex; justify-content: flex-end; margin-top: 48px; }
  @media (max-width: 1000px) {
    .cover2 { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; row-gap: 48px; }
    .c-brand, .c-main, .c-actions { grid-column: 1; grid-row: auto; }
    .c-brand { justify-self: start; max-width: 380px; }
    .c-org b, .c-org .sep { font-size: 15px; }
    .c-actions { margin-top: 0; }
  }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; }
  .sheet-top > span, .sheet-meta { font-family: var(--mono); font-size: 13px; color: var(--mute); letter-spacing: .14em; }
  .cover-title { padding: 96px 0 80px; }
  .cover-title h2 { font-size: 52px; margin: 0; text-align: left; letter-spacing: .1em; line-height: 1.3; font-weight: 600; }
  .cover-title .muted { margin: 24px 0 0; font-size: 15px; letter-spacing: .12em; }
  .cover-notes { border-top: 1.5px solid var(--rule); padding-top: 28px; }
  .sheet .actions { border-top: 0; padding-top: 0; margin-top: 48px; }
  .sheet-meta { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 10px; }
  .done-body { padding: 104px 0 40px; }
  .done-body h2 { text-align: left; font-size: 32px; margin: 0; font-weight: 600; letter-spacing: .08em; }
  .done-id { display: grid; grid-template-columns: 7px auto 1fr; align-items: center; column-gap: 16px; margin: 64px 0 32px;
             padding: 20px 0; border-top: 1.5px solid var(--rule); border-bottom: 1px solid var(--hair); }
  .done-id::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
  .done-id span { font-size: 14px; color: var(--mute); letter-spacing: .14em; }
  .done-id code { font-family: var(--mono); font-size: 26px; font-weight: 400; letter-spacing: .08em; justify-self: end; }

  /* ---------- 條例側欄 ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(255,255,255,.7); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  aside.law {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(540px, 92vw); background: var(--bg); border-left: 1.5px solid var(--rule);
    transform: translateX(100%); transition: transform .25s, visibility .25s; display: flex; flex-direction: column; visibility: hidden;
  }
  aside.law.open { transform: none; visibility: visible; }
  aside.law .law-head { display: flex; justify-content: space-between; align-items: center; padding: 0 32px; height: 84px; flex: none; border-bottom: 1px solid var(--line); }
  aside.law .law-head h2 { font-size: 17px; margin: 0; letter-spacing: .12em; font-weight: 600; }
  .icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; margin-right: -10px; border: 1px solid transparent; border-radius: 50%; background: none; color: var(--ink); cursor: pointer; }
  .icon-btn:hover { border-color: var(--line); }
  .icon-btn:focus-visible { outline: 1px solid var(--ctl); outline-offset: 2px; }
  aside.law .law-body { overflow-y: auto; padding: 12px 32px 56px; font-size: 15px; }
  aside.law h3 { font-size: 18px; margin: 40px 0 12px; letter-spacing: .12em; padding-bottom: 10px; border-bottom: 1px solid var(--hair); }
  aside.law h4 { font-size: 15px; margin: 18px 0 4px; }
  aside.law p, aside.law ol { margin: 0 0 4px; color: var(--ink2); }

  /* ---------- admin ---------- */
  .admin { padding: 32px; overflow: auto; height: 100vh; }
  .admin table { border-collapse: separate; border-spacing: 0; border-radius: var(--radius); font-size: 12px; }
  .admin th, .admin td { border: 1px solid var(--hair); padding: 6px 10px; vertical-align: top; min-width: 8em; max-width: 260px; overflow-wrap: anywhere; }
  .admin th { background: var(--bg); position: sticky; top: 0; font-weight: 600; border-bottom-color: var(--rule); }
  .admin .btn { height: 30px; line-height: 28px; padding: 0 16px; font-size: 12px; margin-right: 6px; }

  @media (max-width: 880px) {
    .ph-no { font-size: 60px; } .ph { gap: 16px; } .ph h2, .page .ph h2 { font-size: 24px; }
    .body { grid-template-columns: minmax(0, 1fr); }
    nav.toc { display: none; }
    main { padding: 36px 22px 80px; }
    header.top { gap: 16px; padding: 0 16px; }
    header.top h1, .top .id-chip { display: none; }
    .sheet { padding: 28px 20px 36px; }
    /* 手機：改成整頁捲動，避免 100vh 內層捲動框在手機瀏覽器下方留白、內容沒畫出來 */
    html, body { height: auto; }
    .app { height: auto; min-height: 100vh; min-height: 100dvh; }
    header.top { position: sticky; top: 0; z-index: 5; }
    main { overflow: visible; }
    .progress { min-width: 0; gap: 12px; }
    .progress .bar { width: auto; flex: 1 1 60px; min-width: 40px; max-width: 180px; }
  }
  @media (max-width: 430px) {
    header.top { gap: 10px; padding: 0 14px; }
    header.top .brand .org { margin-left: 10px; padding-left: 10px; }
    .progress { gap: 10px; }
    .progress .label { font-size: 12px; letter-spacing: .06em; }
    .progress .bar { min-width: 24px; }
    main { padding-left: 18px; padding-right: 18px; }
  }
  @media (max-width: 600px) {
    /* 手機：欄位標籤獨立一行，輸入欄在下一行，避免「出生日期」被拆成兩行 */
    .field { gap: 8px; margin: 22px 0; }
    .field label.lbl { flex-basis: 100%; min-width: 0; margin-bottom: -2px; }
    .field input[type=text]:not([readonly]) { flex: 1; min-width: 0; }
    .field input[data-bind="ch1.y"] { width: 4em !important; }
    /* 手機：確認送出頁 */
    .card.review, .lead + .card.review, .muted + .card.review, .page > .card.review:first-of-type { padding: 18px 18px 20px; }
    .review dl { grid-template-columns: 7.5em minmax(0, 1fr); }
    .review dt { padding-right: 8px; }
    .review .art-head { flex-wrap: wrap; row-gap: 2px; }
    .review .art-t .n { display: inline-block; width: 3.6em; }
    .review .art-head .st { order: 3; flex-basis: 100%; font-size: 13px; padding-left: calc(3.6em + 12px); }
  }
</style>
</head>

/* 編號列表：items 為字串陣列；kind = 'paren' →（一）、'dun' → 一、 */
function nl(items, kind = 'paren') {
  return '<div class="nlist">' + items.map((t, i) =>
    `<div class="ni"><span class="nm">${kind === 'paren' ? `（${CN[i + 1]}）` : `${CN[i + 1]}、`}</span><span class="nt">${t}</span></div>`).join('') + '</div>';
}
/* 鉛筆圖示（確認送出頁的「修改」按鈕） */
const PENCIL = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14 8l2 2"/></svg>';
const pad2 = n => String(n).padStart(2, '0');
/* 單位 LOGO ＋ 名稱 */
/* variant：'mark' = 頁首（字標＋中英名稱）；'full' = 封面／完成頁（完整標誌＋中文名稱） */
function brandHTML(variant = 'mark') {
  const src = CONFIG.ORG_MARK || CONFIG.ORG_LOGO;   // 畫面上一律用字標；完整標誌（含英文）只用在 PDF
  const logo = src
    ? `<img class="logo" src="${src}" alt="${esc(CONFIG.ORG_NAME_EN || CONFIG.ORG_NAME)}">`
    : '<span class="logo logo-ph" aria-hidden="true">LOGO</span>';
  const name = CONFIG.ORG_NAME ? esc(CONFIG.ORG_NAME) : '<span class="ph-text">單位名稱</span>';
  const en = variant === 'full' && CONFIG.ORG_NAME_EN ? `<img class="org-en" src="${CONFIG_LOGO_EN}" alt="${esc(CONFIG.ORG_NAME_EN)}">` : '';   // 封面、完成頁：中文名下方加英文名（標誌原字型）
  return `<div class="brand ${variant}">${logo}<span class="org"><b>${name}</b>${en}</span></div>`;
}
/* 時間軸編號列表：01 / 02 / 03 … */
function tl(items) {
  return '<ol class="tl">' + items.map((t, i) => `<li><span class="tl-no">${pad2(i + 1)}</span><span class="tl-t">${t}</span></li>`).join('') + '</ol>';
}
/* 首頁、完成頁左側的大標誌＋局名 */
function coverBrand(clickable = false) {   // clickable：完成頁可點標誌回首頁
  return `<div class="c-brand${clickable ? ' c-home" data-act="restart" role="button" tabindex="0" title="回到首頁" aria-label="回到首頁' : ''}">
        <img class="c-mark" src="${CONFIG.ORG_MARK || CONFIG.ORG_LOGO}" alt="${esc(CONFIG.ORG_NAME_EN || CONFIG.ORG_NAME)}">

      </div>`;
}

/* 畫面順序。cover / done 不在目錄中 */
const FLOW = ['intro', 'ch1', 'ch4', 'ch2', 'ch3', 'ch5'];   // 步驟順序（鍵名沿用，畫面順序：說明→基本資料→監護人→去留→留存→確認）
const TITLES = {
  intro: '預立化身處置諮商說明',
  ch1: '立書人基本資料',
  ch2: '化身去留',
  ch3: '留存之使用及管理',
  ch4: '化身監護人',
  ch5: '確認送出',
};
/* 各頁頁首：編號 ＋ 中文標題 ＋ 英文副標 */
function pageHead(k) {
  return `<header class="ph"><span class="ph-no">${pad2(FLOW.indexOf(k) + 1)}</span><h2>${TITLES[k]}</h2></header>`;   // 步驟編號已在頁首與目錄顯示，這裡不重複
}

/* =========================================================================
   狀態
   ========================================================================= */
function rocToday() {
  const d = new Date();
  return { y: d.getFullYear() - 1911, m: d.getMonth() + 1, d: d.getDate() };
}
function newId() {
  const n = String(Math.floor(Math.random() * 1e6)).padStart(6, '0');
  return `${CONFIG.ID_PREFIX}-${rocToday().y}-${n}`;
}
function freshState() {
  const ch3 = {};
  ARTICLES.forEach(a => { ch3['a' + a.no] = a.def ? { mode: '', text: '' } : { text: '' }; });   // mode: '' 未選 | 'default' | 'custom'
  return {
    id: newId(),
    startedAt: new Date().toISOString(),
    screen: 'cover',
    confirmed: [],          // 已按「確認」的畫面
    reachedReview: false,   // 是否曾到過確認送出頁（之後按確認會直接回總覽）
    intro: { read: false },
    ch1: { name: '', y: '', m: '', d: '' },
    ch2: { choice: '', duration: '', years: '' },
    ch3,
    ch4: { mode: '', people: [{ name: '', relation: '' }] },   // mode: 'law' | 'designate'；people 依順位排列
    ch5: { agreed: false },
  };
}

let state = loadDraft() || freshState();
function loadDraft() { try { return JSON.parse(localStorage.getItem(LS_DRAFT)); } catch (e) { return null; } }
function saveDraft() { try { localStorage.setItem(LS_DRAFT, JSON.stringify(state)); } catch (e) {} }
function clearDraft() { try { localStorage.removeItem(LS_DRAFT); } catch (e) {} }

const getPath = (p) => p.split('.').reduce((o, k) => (o == null ? o : o[k]), state);
function setPath(p, v) {
  const ks = p.split('.'); let o = state;
  ks.slice(0, -1).forEach(k => o = o[k]);
  o[ks[ks.length - 1]] = v;
}

const isConfirmed = s => state.confirmed.includes(s);
const isSkipped = s => s === 'ch3' && state.ch2.choice === 'deregister';
const activeFlow = () => FLOW.filter(s => !isSkipped(s));
function frontier() { return activeFlow().find(s => !isConfirmed(s)) || 'ch5'; }

/* =========================================================================
   驗證：回傳 [{ field, msg }]
   ========================================================================= */
function validate(s) {
  const e = [];
  const blank = v => !String(v ?? '').trim();
  if (s === 'intro' && !state.intro.read) e.push({ field: 'intro.read', msg: '請勾選「我已閱讀並了解諮商說明」' });
  if (s === 'ch1') {
    const c = state.ch1;
    if (blank(c.name)) e.push({ field: 'ch1.name', msg: '請填寫立書人姓名' });
    const y = +c.y, m = +c.m, d = +c.d;
    if (!y || !m || !d) e.push({ field: 'ch1.y', msg: '請填寫完整出生日期' });
    else {
      const dt = new Date(y + 1911, m - 1, d);
      const ok = dt.getMonth() === m - 1 && dt <= new Date() && y >= 1;
      if (!ok) e.push({ field: 'ch1.y', msg: '出生日期不正確' });
    }
  }
  if (s === 'ch2') {
    const c = state.ch2;
    if (!c.choice) e.push({ field: 'ch2.choice', msg: '請選擇「留存」或「除籍」' });
    if (c.choice === 'keep') {
      if (!c.duration) e.push({ field: 'ch2.duration', msg: '請選擇存續期間' });
      if (c.duration === 'limited' && !(+c.years >= 1)) e.push({ field: 'ch2.years', msg: '請填寫存續年數（至少 1 年）' });
    }
  }
  if (s === 'ch3') {
    ARTICLES.forEach(a => {
      const v = state.ch3['a' + a.no];
      if (a.def && !v.mode)
        e.push({ field: `ch3.a${a.no}.text`, msg: `第${CN[a.no]}條 ${a.title}：請選擇「同意預設條款」或「另有意見」` });
      if (a.def && v.mode === 'custom' && blank(v.text))
        e.push({ field: `ch3.a${a.no}.text`, msg: `第${CN[a.no]}條 ${a.title}：選擇「另有意見」後請註明內容，或改回「同意預設條款」` });
    });
  }
  if (s === 'ch4') {
    const c = state.ch4;
    if (!c.mode) e.push({ field: 'ch4.mode', msg: '請選擇監護人的決定方式' });
    if (c.mode === 'designate') c.people.forEach((x, i) => {
      if (blank(x.name)) e.push({ field: `ch4.people.${i}.name`, msg: `第 ${i + 1} 順位：請填寫姓名` });
      if (blank(x.relation)) e.push({ field: `ch4.people.${i}.relation`, msg: `第 ${i + 1} 順位：請填寫與本人關係` });
    });
  }
  if (s === 'ch5' && !state.ch5.agreed) e.push({ field: 'ch5.agreed', msg: '請勾選同意' });
  return e;
}

/* =========================================================================
   導覽
   ========================================================================= */
let errors = [];

function scrollTop0() { document.getElementById('main').scrollTop = 0; window.scrollTo(0, 0); }
function goTo(s) {
  // 離開一個已確認但被改壞的畫面 → 取消其確認狀態
  const cur = state.screen;
  // 往後跳（目錄點後面的步驟）時，目前這頁若未填完，攔下來顯示錯誤；往前回去則不攔
  const af = activeFlow();
  if (cur !== 'ch5' && af.includes(cur) && af.includes(s) && af.indexOf(s) > af.indexOf(cur)) {
    const errs = validate(cur);
    if (errs.length) {
      state.confirmed = state.confirmed.filter(x => x !== cur);
      errors = errs;
      saveDraft(); render();
      scrollTop0();
      return;
    }
  }
  if (FLOW.includes(cur) && isConfirmed(cur) && validate(cur).length) {
    state.confirmed = state.confirmed.filter(x => x !== cur);
  }
  state.screen = s;
  if (s === 'ch5') state.reachedReview = true;
  errors = [];
  saveDraft();
  render();
  scrollTop0();
}

function confirmScreen() {
  const s = state.screen;
  errors = validate(s);
  if (errors.length) { renderMain(); scrollTop0(); return; }
  if (!isConfirmed(s)) state.confirmed.push(s);
  if (s === 'ch5') return submitForm();
  let next;
  if (state.reachedReview) {
    next = activeFlow().find(x => x !== 'ch5' && !isConfirmed(x)) || 'ch5';
  } else {
    const af = activeFlow();
    next = af[af.indexOf(s) + 1];
  }
  goTo(next);
}

function prevScreen() {
  const af = activeFlow();
  const i = af.indexOf(state.screen);
  goTo(i <= 0 ? 'cover' : af[i - 1]);
}

/* =========================================================================
   送出 / 紀錄
   ========================================================================= */
const RECORD_FIELDS = [
  ['id', '化身登記編號'], ['submittedAt', '送出時間'], ['startedAt', '開始填寫時間'],
  ['name', '立書人姓名'], ['birth', '出生日期（民國）'],
  ['decision', '化身去留'], ['duration', '存續期間'],
  ...ARTICLES.flatMap(a => a.def
    ? [[`a${a.no}_mode`, `第${CN[a.no]}條 ${a.title}｜選擇`], [`a${a.no}_text`, `第${CN[a.no]}條 ${a.title}｜意見內容`]]
    : [[`a${a.no}_text`, `第${CN[a.no]}條 ${a.title}`]]),
  ['guardian_mode', '監護人決定方式'], ['guardian_count', '指定人數'],
  ['guardians', '指定監護人（依順位）'],
  ['agreedDate', '同意日期（民國）'],
];

function buildRecord() {
  const keep = state.ch2.choice === 'keep';
  const t = rocToday();
  const r = {
    id: state.id,
    submittedAt: new Date().toISOString(),
    startedAt: state.startedAt,
    name: state.ch1.name.trim(),
    birth: `${state.ch1.y}/${state.ch1.m}/${state.ch1.d}`,
    decision: keep ? '留存' : '除籍',
    duration: !keep ? '' : (state.ch2.duration === 'unlimited' ? '無期限' : `${state.ch2.years} 年`),
    guardian_mode: state.ch4.mode === 'designate' ? '本人指定' : '繼承人協議推選',
    guardian_count: state.ch4.mode === 'designate' ? state.ch4.people.length : 0,
    // CSV / 試算表用的文字欄；JSON 另有結構化的 guardianList
    guardians: state.ch4.mode === 'designate'
      ? state.ch4.people.map((x, i) => `${i + 1}. ${x.name.trim()}（${x.relation.trim()}）`).join('；') : '',
    guardianList: state.ch4.mode === 'designate'
      ? state.ch4.people.map((x, i) => ({ order: i + 1, name: x.name.trim(), relation: x.relation.trim() })) : [],
    agreedDate: `${t.y}/${t.m}/${t.d}`,
  };
  ARTICLES.forEach(a => {
    const v = state.ch3['a' + a.no];
    if (a.def) {
      r[`a${a.no}_mode`] = !keep ? '不適用' : (v.mode === 'custom' ? '另有意見' : '同意預設');
      r[`a${a.no}_text`] = keep && v.mode === 'custom' ? v.text.trim() : '';
    } else {
      r[`a${a.no}_text`] = keep ? v.text.trim() : '';
    }
  });
  return r;
}
/* 試算表用：時間改成本地時間（例：2026/11/18 18:56:45），比 ISO 格式好讀 */
const fmtLocal = iso => { const d = new Date(iso); if (isNaN(d)) return iso || '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
/* 民國日期改成純文字（例：民國 90 年 3 月 3 日），避免 Google 試算表自動轉成西元日期 */
const rocText = v => { const m = String(v || '').match(/^(\d+)\/(\d+)\/(\d+)$/); return m ? `民國 ${m[1]} 年 ${m[2]} 月 ${m[3]} 日` : (v || ''); };
const toLabeled = r => Object.fromEntries(RECORD_FIELDS.map(([k, l]) =>
  [l, (k === 'submittedAt' || k === 'startedAt') ? fmtLocal(r[k]) : (k === 'birth' || k === 'agreedDate') ? rocText(r[k]) : (r[k] ?? '')]));

function getSubs() { try { return JSON.parse(localStorage.getItem(LS_SUBS)) || []; } catch (e) { return []; } }

let lastRecord = null, sheetStatus = '';
async function submitForm() {
  const rec = buildRecord();
  lastRecord = { rec, snapshot: JSON.parse(JSON.stringify(state)) };
  const subs = getSubs(); subs.push(rec);
  try { localStorage.setItem(LS_SUBS, JSON.stringify(subs)); } catch (e) {}
  clearDraft();
  state.screen = 'done';
  sheetStatus = CONFIG.SHEETS_ENDPOINT ? '申請送出中…' : '';
  render();
  if (CONFIG.SHEETS_ENDPOINT) {
    outboxPut(rec);
    const ok = await sendToSheet(rec);
    if (ok) outboxRemove(rec.id);
    sheetStatus = ok ? '已申請成功' : '申請送出失敗（已存於本機，下次開啟表單時會自動補送）';
    if (state.screen === 'done') render();
  }
}

/* ---- 雲端傳送：keepalive 讓視窗關閉後請求仍可完成；未確認送達者留在 outbox 補送 ---- */
let sending = 0;
async function sendToSheet(rec) {
  const body = JSON.stringify(toLabeled(rec));
  sending++;
  try {
    await fetch(CONFIG.SHEETS_ENDPOINT, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body, keepalive: body.length < 60000,   // 瀏覽器 keepalive 上限約 64KB
    });
    return true;
  } catch (e) { return false; }
  finally { sending--; }
}
const outboxGet = () => { try { return JSON.parse(localStorage.getItem(LS_OUTBOX) || '[]'); } catch (e) { return []; } };
const outboxSet = list => { try { localStorage.setItem(LS_OUTBOX, JSON.stringify(list)); } catch (e) {} };
const outboxPut = rec => outboxSet(outboxGet().filter(r => r.id !== rec.id).concat([rec]));
const outboxRemove = id => outboxSet(outboxGet().filter(r => r.id !== id));
async function flushOutbox() {
  if (!CONFIG.SHEETS_ENDPOINT) return;
  for (const rec of outboxGet()) { if (await sendToSheet(rec)) outboxRemove(rec.id); }
}
/* 傳送中關閉視窗時提醒 */
window.addEventListener('beforeunload', e => { if (sending > 0) { e.preventDefault(); e.returnValue = ''; } });


/* =========================================================================
   渲染：目錄
   ========================================================================= */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function articleStatus(a) {
  const v = state.ch3['a' + a.no];
  if (!a.def) return v.text.trim() ? ['已填寫', 'mod'] : ['未填', ''];
  if (v.mode === 'custom') return v.text.trim() ? ['另有意見', 'mod'] : ['待填寫', 'warn'];
  if (!v.mode) return ['未選擇', errors.some(x => x.field === `ch3.a${a.no}.text`) ? 'warn' : ''];   // 按確認後才變紅
  return ['同意預設', ''];
}

function renderTOC() {
  const s = state.screen;
  const locked = s === 'cover' || s === 'done';
  const fr = frontier();
  let h = '<ul class="steps">';
  FLOW.forEach((k, idx) => {
    const cls = ['item'];
    let tag = '';
    const skipped = isSkipped(k);
    const clickable = !locked && !skipped && k !== s && (isConfirmed(k) || k === fr);
    if (k === s) cls.push('current');
    else if (skipped) { cls.push('skipped'); tag = '不適用'; }
    else if (isConfirmed(k) || s === 'done') cls.push('done');
    if (clickable) cls.push('clickable');
    h += `<li><button class="${cls.join(' ')}" ${clickable ? `data-go="${k}"` : 'tabindex="-1"'}>
            <span class="dot"></span><span class="num">${pad2(idx + 1)}</span><span class="ttl">${TITLES[k]}</span><span class="tag">${tag}</span></button>`;
    if (k === 'ch3' && s === 'ch3') {      // 只在填第三章時展開
      h += '<ul class="sub">';
      ARTICLES.forEach(a => {
        const [st, c] = articleStatus(a);
        h += `<li><button class="item clickable" data-scroll="art${a.no}" id="tocArt${a.no}">
                <span class="ttl">${a.title}</span><span class="tag ${c}">${st}</span></button></li>`;
      });
      h += '</ul>';
    }
    h += '</li>';
  });
  h += '</ul><hr><ul class="extra"><li><button class="item clickable law-link" data-law="1"><span></span><span class="ttl">身後化身管理條例</span><span class="tag">開啟<span class="tri"></span></span></button></li></ul>';
  // 內容沒變就不重建：避免輸入框失焦觸發 change 時重繪目錄，吃掉使用者對目錄的點擊
  const toc = document.getElementById('toc');
  if (toc._html !== h) { toc.innerHTML = h; toc._html = h; }
  if (s === 'ch3') updateInView();
}

function renderHeader() {
  const s = state.screen;
  const af = activeFlow();
  let pct = 0, label = '尚未開始';
  if (s === 'done') { pct = 100; label = '已完成'; }
  else if (af.includes(s)) { const i = af.indexOf(s); pct = Math.round(i / af.length * 100); label = `<b>${pad2(i + 1)}</b> / ${pad2(af.length)}`; }
  document.getElementById('progress').innerHTML = `<span class="label">${label}</span><div class="bar"><span style="width:${pct}%"></span></div>`;
  document.getElementById('idChip').innerHTML = s === 'cover' ? '' : `<span class="no">NO.</span>${state.id}`;
}

const text = (path, ph = '', size = 20) =>

const navBtns = (primary = '下一步', back = true) =>

/* 首頁：依右欄內容高度，調整左側 LOGO＋局名的寬度，讓兩塊等高（左右並排時才作用） */
function fitCoverBrand() {
  const grid = document.querySelector('.cover2');
  if (!grid) return;
  const b = grid.querySelector('.c-brand'), m = grid.querySelector('.c-main'), mark = b.querySelector('.c-mark'), org = b.querySelector('.c-org');
  b.style.width = '';
  if (getComputedStyle(grid).gridTemplateColumns.split(' ').length < 2) return;   // 上下排時不調整
  const colW = b.getBoundingClientRect().width;
  const ratio = (mark.naturalWidth && mark.naturalHeight) ? mark.naturalWidth / mark.naturalHeight : 3.53;
  m.style.alignSelf = 'start';
  const H = m.getBoundingClientRect().height;   // 右欄自然高度
  m.style.alignSelf = '';
  const gap = parseFloat(getComputedStyle(org).marginTop) || 0;
  let w = colW;
  for (let i = 0; i < 4; i++) {                 // 局名列高度會隨寬度變，反覆收斂
    b.style.width = w + 'px';
    w = Math.min(colW, (H - org.getBoundingClientRect().height - gap) * ratio);
  }
  b.style.width = w + 'px';
}
window.addEventListener('resize', fitCoverBrand);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCoverBrand);

  document.getElementById('app').classList.toggle('no-toc', state.screen === 'cover' || state.screen === 'done');
  document.getElementById('app').classList.toggle('no-head', state.screen === 'cover' || state.screen === 'done');   // 首頁、完成頁已有標誌，不顯示頁首   // 封面已有標誌，不顯示頁首   // 封面、完成頁不顯示目錄
  renderHeader(); renderTOC(); renderMain();
  if (state.screen === 'cover' || state.screen === 'done') {
    fitCoverBrand();

/* data-show="path=value" → 依狀態顯示 / 隱藏 */
function applyShows() {
  document.querySelectorAll('[data-show]').forEach(el => {
    const [p, v] = el.dataset.show.split('=');
    el.hidden = getPath(p) !== v;
  });
}

function refreshErrorBox() {      // 修正欄位後即時更新錯誤提示
  const box = document.querySelector('.errors');
  if (!box) return;
  if (!errors.length) box.remove();
  else box.outerHTML = errorBox();
}

function markErrors() {
  const fields = new Set(errors.map(e => e.field));
  document.querySelectorAll('[data-bind]').forEach(el => el.classList.toggle('invalid', fields.has(el.dataset.bind) && el.type !== 'radio' && el.type !== 'checkbox'));
  document.querySelectorAll('[data-field]').forEach(el => el.classList.toggle('invalid-box', fields.has(el.dataset.field)));
  // 出生日期：年月日一起標
  if (fields.has('ch1.y')) document.querySelectorAll('[data-bind^="ch1."]:not([data-bind="ch1.name"])').forEach(el => el.classList.add('invalid'));
}

function updateConfirmBtn() {
  const b = document.getElementById('confirmBtn');
  if (b && state.screen === 'ch5') b.disabled = !state.ch5.agreed;   // 先勾選，再送出
}

/* 第三章：目錄跟著捲動標示目前條文 */
let spy = null, inView = null;
function setupScrollSpy() {
  if (spy) spy.disconnect();
  const root = document.getElementById('main');
  spy = new IntersectionObserver(entries => {
    const vis = [...document.querySelectorAll('[id^="art"]')]
      .filter(el => { const r = el.getBoundingClientRect(), rr = root.getBoundingClientRect(); return r.bottom > rr.top + 80 && r.top < rr.bottom; });
    inView = vis.length ? vis[0].id : null;
    updateInView();
  }, { root, threshold: [0, .25, .5, .75, 1] });
  document.querySelectorAll('[id^="art"]').forEach(el => spy.observe(el));
}
function updateInView() {
  document.querySelectorAll('.toc .sub .item').forEach(b => b.classList.toggle('inview', b.dataset.scroll === inView));
}

   事件
   ========================================================================= */
function onChange(e) {
  const el = e.target;
  const p = el.dataset.bind;
  if (!p) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.type === 'radio' && !el.checked) return;
  setPath(p, v);
  // 點「以__年為限」的年數欄位時，自動選取該選項
  // 在「另有意見」輸入框寫字時，自動選取「另有意見」
  const mText = p.match(/^ch3\.a(\d+)\.text$/);
  if (mText && String(v).trim() && ARTICLES[+mText[1] - 1].def && state.ch3['a' + mText[1]].mode !== 'custom') {
    state.ch3['a' + mText[1]].mode = 'custom';
    const r = document.querySelector(`input[name="ch3.a${mText[1]}.mode"][value="custom"]`); if (r) r.checked = true;
    errors = errors.filter(x => x.field !== p);
  }
  if (p === 'ch2.years') { state.ch2.duration = 'limited'; const r = document.querySelector('input[name="ch2.duration"][value="limited"]'); if (r) r.checked = true; }
  // 改變去留 → 第三章的跳過狀態改變
  if (p === 'ch2.choice' && isConfirmed('ch2')) { /* 保持 ch2 已確認，但下一步會依新選擇決定 */ }
  // 清掉該欄位的錯誤標記
  if (errors.length) { errors = errors.filter(x => !(x.field === p || (p.startsWith('ch1.') && x.field === 'ch1.y' && p !== 'ch1.name') || (p === 'ch2.years' && x.field === 'ch2.duration') || x.field === p.replace(/\.mode$/, '.text'))); markErrors(); refreshErrorBox(); }
  saveDraft();
  applyShows();
  updateConfirmBtn();
  renderTOC();
}

document.getElementById('page').addEventListener('input', onChange);
document.getElementById('page').addEventListener('change', onChange);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-go],[data-law],[data-scroll]');
  if (!t) return;
  if (t.dataset.law) return openLaw();
  if (t.dataset.go) return goTo(t.dataset.go);
  if (t.dataset.scroll) { document.getElementById(t.dataset.scroll).scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  switch (t.dataset.act) {
    case 'advice': return openAdvice(+t.dataset.no);
    case 'advClose': return closeAdvice();
    case 'lawAt': return openLawAt(t.dataset.art);
    case 'advWrite': {   // 關閉建議，選「另有意見」並把游標放進輸入框
      const no = +t.dataset.no; closeAdvice();
      const ta = document.querySelector(`[data-bind="ch3.a${no}.text"]`);
      const r = document.querySelector(`input[name="ch3.a${no}.mode"][value=custom]`);
      if (r && !r.checked) { r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true })); }
      const ta2 = document.querySelector(`[data-bind="ch3.a${no}.text"]`) || ta;
      if (ta2) { ta2.scrollIntoView({ block: 'center' }); ta2.focus(); }
      return;
    }
    case 'start': return goTo('intro');
    case 'home': {   // 點頁首標誌：回首頁（有填寫內容時先確認）
      if (state.screen === 'cover') return;
      document.getElementById('homeDlg').hidden = false;
      document.querySelector('#homeDlg [data-act=homeCancel]').focus();
      return;
    }
    case 'restart': {   // 完成頁：資料已送出保存，直接回首頁、開始新的一份
      state = freshState(); errors = []; lastRecord = null; sheetStatus = '';
      render(); scrollTop0();
      return;
    }
    case 'homeCancel': document.getElementById('homeDlg').hidden = true; return;
    case 'homeConfirm': {
      document.getElementById('homeDlg').hidden = true;
      clearDraft(); state = freshState(); errors = []; lastRecord = null;
      render(); scrollTop0();
      return;
    }
    case 'prev': return prevScreen();
    case 'confirm': return confirmScreen();
    case 'pdf': return printPdf();
    case 'toggleDef': {   // 總覽：展開／收合該條預設條款
      const box = t.closest('.art').querySelector('.def-text');
      box.hidden = !box.hidden;
      t.setAttribute('aria-expanded', String(!box.hidden));
      return;
    }
    case 'addPerson': {
      state.ch4.people.push({ name: '', relation: '' }); saveDraft(); renderMain(); renderTOC();
      const inputs = document.querySelectorAll('[data-bind$=".name"][data-bind^="ch4.people."]');
      inputs[inputs.length - 1].focus(); return;
    }
    case 'rmPerson': {
      state.ch4.people.splice(+t.dataset.i, 1);
      errors = errors.filter(x => !x.field.startsWith('ch4.people.'));
      saveDraft(); renderMain(); renderTOC(); return;
    }
  }
});

function marqueeHTML(no) {
  const P = PROMPTS[no]; if (!P) return '';
  const mix = arr => arr.slice().sort(() => Math.random() - .5);   // 同組內每次打開順序不同
  const A = mix(P.a), D = mix(P.d), list = [];
  for (let i = 0; i < Math.max(A.length, D.length); i++) { if (A[i]) list.push(A[i]); if (D[i]) list.push(D[i]); }   // 荒謬－日常輪替
  const row = list.map(x => `<span class="mq-i">${esc(x)}</span>`).join('');
  const dur = Math.max(20, list.join('').length * 0.95);   // 依字數調整速度（11-27 加快約 15%）
  return `<div class="adv-mq"><span class="adv-mq-t">本局近期受理之意見（摘錄）</span>
    <div class="mq" aria-label="${esc(list.join('、'))}"><div class="mq-track" style="animation-duration:${dur}s" aria-hidden="true">${row}${row}</div></div></div>`;
}

/* 下載 PDF：用隱藏 iframe 載入文件後呼叫瀏覽器列印，使用者選「另存為 PDF」。
   預設檔名取自文件 <title>。正式產品可改由後端產生 PDF。 */
function printPdf() {
  if (!lastRecord) return;
  const old = document.getElementById('printFrame'); if (old) old.remove();
  const f = document.createElement('iframe');
  f.id = 'printFrame';
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  f.onload = () => { f.contentWindow.focus(); f.contentWindow.print(); };
  f.srcdoc = buildDocHTML();
  document.body.appendChild(f);
}

/* =========================================================================
   管理頁（#admin）：檢視本機紀錄、匯出
   ========================================================================= */
function renderAdmin() {
  const subs = getSubs();
  document.getElementById('app').style.display = 'none';
  let el = document.getElementById('admin');
  if (!el) { el = document.createElement('div'); el.id = 'admin'; el.className = 'admin'; document.body.appendChild(el); }
  el.innerHTML = `
    <h1 style="font-size:20px">管理頁｜已送出的委託申請（本機）共 ${subs.length} 份</h1>
    <p>
      <button class="btn" id="expCsv" ${subs.length ? '' : 'disabled'}>匯出 CSV</button>
      <button class="btn" id="expJson" ${subs.length ? '' : 'disabled'}>匯出 JSON</button>
      <button class="btn" id="clearAll" ${subs.length ? '' : 'disabled'}>清除全部紀錄</button>
      <a href="#" style="margin-left:16px"><span class="tri l" style="margin-right:8px"></span>回到表單</a>
    </p>
    <p class="muted small">雲端傳送：${CONFIG.SHEETS_ENDPOINT ? '已設定 Google 試算表' : '未設定（只存在這台電腦的瀏覽器）'}</p>
    ${subs.length ? `<table><thead><tr>${RECORD_FIELDS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead>
      <tbody>${subs.slice().reverse().map(r => `<tr>${RECORD_FIELDS.map(([k]) => `<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<p>尚無紀錄。</p>'}`;
  const dl = (name, content, type) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  };
  const stamp = new Date().toISOString().slice(0, 10);
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  el.querySelector('#expCsv').onclick = () => dl(`委託申請_${stamp}.csv`,
    '﻿' + [RECORD_FIELDS.map(([, l]) => q(l)).join(','), ...subs.map(r => RECORD_FIELDS.map(([k]) => q(r[k])).join(','))].join('\r\n'), 'text/csv;charset=utf-8');
  el.querySelector('#expJson').onclick = () => dl(`委託申請_${stamp}.json`, JSON.stringify(subs, null, 2), 'application/json');
  const clr = el.querySelector('#clearAll');
  clr.onclick = () => {
    if (clr.dataset.armed) { localStorage.removeItem(LS_SUBS); renderAdmin(); return; }
    clr.dataset.armed = '1'; clr.textContent = '再按一次確認清除'; clr.style.borderColor = '#c00'; clr.style.color = '#c00';
  };
}

function route() {
  if (location.hash === '#admin') return renderAdmin();
  const a = document.getElementById('admin'); if (a) a.remove();
  document.getElementById('app').style.display = '';
  if (state.screen === 'done' && !lastRecord) state = freshState();
  render();
}
window.addEventListener('hashchange', route);
route();
flushOutbox();   // 補送上次未確認送達的紀錄
</script>
<script>
/* 有些 Android 手機的中文字型只有一種粗細、瀏覽器也不會自動加粗：偵測後在 <html> 加上 no-cjk-bold，用細描邊模擬粗體 */
(function () {
  try {
    const c = document.createElement('canvas'); c.width = 120; c.height = 64; const x = c.getContext('2d');
    const fam = getComputedStyle(document.body).fontFamily;
    const ink = w => { x.clearRect(0, 0, 120, 64); x.font = w + ' 48px ' + fam;
      x.fillText('身體', 0, 50); const d = x.getImageData(0, 0, 120, 64).data; let n = 0; for (let i = 3; i < d.length; i += 4) n += d[i]; return n; };
    const a = ink('400'), b = ink('700');
    if (a > 0 && b / a < 1.08) document.documentElement.classList.add('no-cjk-bold');
  } catch (e) {}
})();
</script>
