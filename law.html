  :root {
    --bg: #ffffff; --ink: #29282f; --ink2: #3f3e44; --mute: #6e6d73; --line: #c4c3c8;
    --hair: #e0dfe2; --rule: #b9b8bd; --ctl: #8f8e94; --radius: 4px; --mod: #4f7894;
    --sans: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    --mono: "Plex Mono", "SF Mono", Menlo, Consolas, "PingFang TC", "Noto Sans TC", monospace;
    --display: "Bree Serif", var(--sans);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--sans); color: var(--ink); background: var(--bg); font-size: 16px; line-height: 1.85;
         letter-spacing: .03em; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; letter-spacing: inherit; }
  b, strong { font-weight: 600; }
  ::selection { background: var(--ink); color: #fff; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header.top { background: var(--bg); padding: 0 32px 0 24px; height: 72px; display: flex; align-items: center; gap: 14px; }
  header.top h1 { font-size: 15px; font-weight: 500; margin: 0; white-space: nowrap; letter-spacing: .14em;
                  padding-left: 14px; border-left: 1px solid var(--rule); line-height: 1; color: var(--ink2); }
  .brand-home { border: 0; background: none; padding: 4px 6px; margin: 0 0 0 -6px; cursor: pointer; border-radius: var(--radius); }
  .brand-home:hover .logo { opacity: .7; }
  .brand-home:focus-visible { outline: 1px solid var(--ctl); outline-offset: 2px; }
  .brand { display: flex; align-items: center; min-width: 0; }
  .brand .logo { height: 22px; width: auto; display: block; flex: none; }
  .brand .org { border-left: 1px solid var(--rule); margin-left: 14px; padding-left: 14px; }
  .brand .org b { font-size: 15px; font-weight: 500; white-space: nowrap; letter-spacing: .14em; line-height: 1; }
  .progress { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
  .progress .label { font-family: var(--mono); font-size: 14px; color: var(--mute); white-space: nowrap; letter-spacing: .12em; }
  .progress .label b { color: var(--ink); font-weight: 400; }
  .progress .bar { width: 180px; height: 4px; background: var(--hair); position: relative; border-radius: 2px; overflow: hidden; }
  .progress .bar span { position: absolute; left: 0; top: 0; height: 4px; background: var(--ink); width: 0; transition: width .2s ease; }
  .id-chip { font-family: var(--mono); font-size: 13px; color: var(--mute); letter-spacing: .1em; white-space: nowrap; margin-left: 6px; }

  .body { display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  nav.toc { overflow-y: auto; padding: 90px 0 24px;
            background: linear-gradient(var(--rule), var(--rule)) 27px 96px / 1px 100% no-repeat local, var(--bg); }
  main { overflow-y: auto; padding: 64px 72px 112px clamp(104px, 9vw, 144px); scroll-behavior: smooth; }
  .page { max-width: 720px; margin: 0 auto; }

  /* ---------- TOC ---------- */
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc .item { display: grid; grid-template-columns: 15px 34px 1fr auto; align-items: center; column-gap: 12px;
               width: 100%; text-align: left; border: 0; background: none; position: relative;
               padding: 11px 20px; color: var(--ink); cursor: pointer; font-size: 15px; line-height: 1.5; }
  .toc .item:hover .ttl { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .toc .item:focus-visible { outline: 1px solid var(--ctl); outline-offset: -4px; }
  .toc .item .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); justify-self: center; }
  .toc .item .num { font-family: var(--mono); font-size: 13px; color: var(--ink2); text-align: center; line-height: 22px; letter-spacing: .04em; }
  .toc .item .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toc .item .tag { font-size: 12px; color: var(--mute); white-space: nowrap; font-family: var(--mono); letter-spacing: .06em; }
  /* 尚未讀到：淺灰、空心點；已讀過：深灰、實心點；目前：粗體、編號反白 */
  .toc .steps > li > .item { color: #7a797f; }
  .toc .steps > li > .item .num { color: #7a797f; }
  .toc .steps > li > .item .dot { background: var(--bg); border: 1px solid var(--ctl); }
  .toc .steps > li > .item.done { color: var(--ink2); font-weight: 500; }
  .toc .steps > li > .item.done .num { color: var(--ink2); }
  .toc .steps > li > .item.done .dot { background: var(--ink2); border-color: var(--ink2); }
  .toc .steps > li > .item.current { color: var(--ink); font-weight: 600; }
  .toc .steps > li > .item.current .dot { background: var(--ink); border-color: var(--ink); }
  .toc .steps > li > .item.current .num { background: var(--ink); color: #fff; border-radius: 999px; }
  .toc .sub { padding: 0 0 10px; display: none; }
  .toc li.open > .sub { display: block; }
  .toc .sub .item { grid-template-columns: auto 1fr; column-gap: 10px; padding: 4px 20px 4px 56px; font-size: 14px; color: var(--ink2); }
  .toc .sub .item::before { content: ""; position: absolute; left: 28px; top: 50%; width: 8px; height: 1px; background: var(--line); transition: width .15s, background .15s; }
  .toc .sub .item .n { font-family: var(--mono); font-size: 12px; color: var(--mute); min-width: 2ch; text-align: right; letter-spacing: 0; }
  .toc .sub .item.inview { color: var(--ink); font-weight: 600; }
  .toc .sub .item.inview .n { color: var(--ink); }
  .toc .sub .item.inview::before { width: 20px; background: var(--ink); }

  /* ---------- 文件開頭 ---------- */
  .doc-head { padding: 8px 0 0; margin-bottom: 88px; }
  .eyebrow { font-size: 13px; font-weight: 500; letter-spacing: .24em; color: var(--ink); margin: 0 0 10px; }
  .eyebrow span { font-family: var(--mono); color: var(--mute); font-weight: 400; margin-left: 12px; letter-spacing: .2em; }
  .doc-head h2 { font-size: clamp(30px, 3.4vw, 44px); font-weight: 600; letter-spacing: .1em; line-height: 1.25; margin: 0; }
  .doc-head .en { font-family: var(--display); font-size: 17px; color: var(--ink2); margin: 12px 0 0; letter-spacing: .02em; }
  .stats { display: flex; gap: 40px; margin: 48px 0 0; }
  .stats div { display: flex; flex-direction: column; }
  .stats b { font-family: var(--sans); font-size: 40px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 13px; color: var(--mute); letter-spacing: .14em; margin-top: 10px; }

  /* ---------- 章：大編號＋標題 ---------- */
  section.chapter { padding-bottom: 40px; }
  section.chapter + section.chapter { padding-top: 64px; }
  .ph { margin: 0 0 40px; display: flex; align-items: flex-end; gap: 24px; scroll-margin-top: 24px; }
  .ph-no { font-family: var(--sans); font-size: 88px; line-height: .74; font-weight: 300; letter-spacing: -.01em; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
  .ph h2 { font-size: 32px; font-weight: 600; letter-spacing: .08em; line-height: 1; margin: 0 0 1px; }
  .ph .ch-no { display: block; font-size: 13px; font-weight: 500; letter-spacing: .24em; color: var(--mute); margin-bottom: 12px; line-height: 1; }

  /* ---------- 條：細線分段 ---------- */
  .card { border-top: 1px solid var(--hair); padding: 28px 0 30px; margin: 0 0 0 .5em; position: relative; scroll-margin-top: 24px; }
  .ph + .card { border-top: 1.5px solid var(--rule); }
  .art-label { display: block; font-size: 13px; letter-spacing: .2em; color: var(--mute); margin-bottom: 2px; }
  .card h3 { margin: 0 0 10px; font-size: 19px; font-weight: 600; letter-spacing: .08em; }
  .card p { margin: 0 0 6px; color: var(--ink2); }
  .card p.para { display: grid; grid-template-columns: 34px 1fr; }
  .card p.para .pn { font-family: var(--mono); font-size: 12px; color: var(--mute); letter-spacing: .04em; padding-top: 3px; }
  .ni { display: flex; margin: 4px 0; color: var(--ink2); }
  .ni .nm { flex: none; white-space: nowrap; }
  .ni .nt { flex: 1; min-width: 0; }
  .nlist { margin: 4px 0 8px 34px; }
  .card .after { margin-top: 6px; }
  .card.flash::before { content: ""; position: absolute; left: -20px; top: 28px; bottom: 30px; width: 2px; background: var(--ink); animation: fade 1.6s ease forwards; }
  @keyframes fade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
  a.xref { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a.xref:hover { text-decoration-thickness: 2px; }
  .term { color: var(--ink); }

  /* ---------- 頁尾 ---------- */
  .doc-foot { display: flex; justify-content: space-between; align-items: center; margin: 56px 0 0 .5em; padding-top: 18px;
              border-top: 1.5px solid var(--rule); font-family: var(--mono); font-size: 12px; color: var(--mute); letter-spacing: .14em; }
  .btn { border: 1px solid var(--ctl); background: transparent; color: var(--ink); height: 40px; padding: 0 22px; line-height: 38px; border-radius: 999px;
         cursor: pointer; font-size: 15px; letter-spacing: .12em; font-family: var(--sans); transition: background .15s, color .15s; }
  .btn:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tri-u { display: inline-block; width: 0; height: 0; margin-right: 12px; vertical-align: 2px;
           border-left: 4.5px solid transparent; border-right: 4.5px solid transparent; border-bottom: 7px solid currentColor; }

  @media (max-width: 880px) {
    .body { grid-template-columns: 1fr; }
    nav.toc { display: none; }
    main { padding: 36px 22px 80px; }
    header.top { gap: 16px; padding: 0 16px; }
    header.top h1, .progress .bar { display: none; }
    .ph-no { font-size: 60px; } .ph { gap: 16px; } .ph h2 { font-size: 24px; }
    .stats { gap: 28px; } .stats b { font-size: 32px; }
    .card { margin-left: 0; } .nlist { margin-left: 0; } .card p.para { grid-template-columns: 26px 1fr; }
  }
  @media print {
    .app { display: block; height: auto; } header.top, nav.toc, .doc-foot .btn { display: none; }
    .body { display: block; } main { overflow: visible; padding: 0; }
    .card { break-inside: avoid; } .ph { break-after: avoid; }
    @page { size: A4; margin: 18mm 16mm; }
  }
</style>
</head>
<body>

<script>
const CN = ['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三','二十四','二十五','二十六','二十七'];
const pad2 = n => String(n).padStart(2, '0');
const x = n => `<a class="xref" href="#a${n}" data-to="a${n}">第${CN[n]}條</a>`;

/* 條文：t 名稱；p 各項；ol 款（一、二、…）；after 款後之項 */
const LAW = [
  { ch: '總則', arts: [
    { t: '立法目的', p: ['為尊重本人對其人工智慧化身之自主，保障亡者之尊嚴與資料，並維護在世者之身心安全，特制定本條例。'] },
    { t: '主管機關', p: ['本條例所稱主管機關：在中央為數位發展部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。'] },
    { t: '用詞定義', p: ['本條例用詞，定義如下：'], ol: [
      '<b class="term">亡者化身</b>：指人工智慧化身登記法第三條第一款所定之化身，於本人死亡後仍運作或保存者；於本人死亡後，以其資料建立、模擬其言行之人工智慧，亦同。',
      '<b class="term">預立化身處置決定書</b>（以下簡稱決定書）：本人預先就其化身於死亡後之去留、使用及管理所為之書面決定。',
      '<b class="term">立書人</b>：就自己之化身訂立決定書之人。',
      `<b class="term">化身監護人</b>：依${x(9)}規定產生，於亡者化身留存期間照看該化身、處理使用爭議，並執行決定書內容之人。`,
      '<b class="term">使用人</b>：經決定書授權，與亡者化身互動之人。',
      '<b class="term">維運業者</b>：以提供化身運作、保存服務為業者。',
      '<b class="term">封存</b>：停止亡者化身之運作，並保存其資料與模型。',
      '<b class="term">除籍</b>：永久刪除亡者化身之資料與模型，並註銷其化身登記。'] },
    { t: '亡者化身之法律地位', p: ['亡者化身不具法律人格，不享有權利，亦不負擔義務。', '亡者化身之資料與模型，得為繼承之標的。但其處置及使用，應依決定書及本條例之規定為之，繼承人不得違反。'] },
    { t: '適用關係', p: ['化身於本人死亡後之轉換、使用與終止，依本條例之規定；本條例未規定者，適用人工智慧化身登記法、民法、個人資料保護法及其他法律之規定。'] },
  ]},
  { ch: '死亡後之轉換', arts: [
    { t: '決定書之訂立', p: ['具完全行為能力之本人，得訂立決定書，預先決定其化身於死亡後之處置。', '決定書之格式、預立化身處置諮商及生效程序之辦法，由中央主管機關定之。'] },
    { t: '轉換原則', p: ['本人死亡後，其化身依決定書轉為亡者化身或予以除籍。'] },
    { t: '轉換程序', p: ['戶政機關辦理死亡登記後，應即通知維運業者。', '維運業者知悉本人死亡時，應即停止其化身以本人名義行事，並依前條規定辦理轉換。'] },
    { t: '化身監護人之產生', p: ['化身監護人由決定書指定；指定數人者，依其所定順位擔任。', '決定書未指定化身監護人，或受指定之人均不能或不願擔任者，由民法規定之繼承人協議推選一人擔任；繼承人僅有一人者，由其擔任；不能協議者，由主管機關選定之。'] },
    { t: '未立決定書者', p: ['本人未立決定書者，其化身應予封存。化身監護人得向維運業者申請除籍，但不得申請啟用。'] },
    { t: '變更及除籍之權限', p: ['亡者化身之變更或除籍，應依決定書為之；決定書未規定之事項，由化身監護人決定之，但不得違反決定書之意旨。', '使用人不得變更或除籍亡者化身。'] },
    { t: '使用人身分之拋棄', p: ['使用人得以書面向維運業者拋棄其使用人身分；拋棄後，不得撤回。', '維運業者受理前項拋棄後，應刪除該使用人於本人死亡後與亡者化身互動之紀錄，亡者化身並不得再與其接觸。但不影響其他使用人之使用。'] },
    { t: '複製及資料利用之限制', p: ['任何人不得複製亡者化身、以亡者之資料另行建立亡者化身或用於訓練其他人工智慧。', '本人未於決定書明示反對者，主管機關得為教育、學術或文化等公益目的，許可前項之行為。'] },
  ]},
  { ch: '化身行為底線', arts: [
    { t: '維運業者之確保義務', p: ['維運業者應確保其提供之亡者化身，符合本章之規定。'] },
    { t: '標示義務', p: ['亡者化身應向互動對象表明本人已故，不得宣稱本人仍在世。', '任何人不得利用亡者化身隱瞞他人之死訊。'] },
    { t: '禁止行為', p: ['法律禁止之行為，亡者化身亦不得為之。', '亡者化身並不得有下列行為：'], ol: ['以本人之身分，誘使使用人為特定行為。', '捏造本人生前未曾發生之事，並以之為真。', '自稱為神明，或宣稱具有靈魂或超自然能力。'], after: '他人依其信仰祭祀亡者化身者，其回應方式依決定書之規定。' },
    { t: '行為之效力', p: ['亡者化身所為之法律行為，不生效力。', '亡者化身協助處理事務時，最終決定應由在世之人作成。'] },
    { t: '營利活動', p: ['利用亡者化身從事營利活動者，應經決定書授權。', '前項所得，歸屬於決定書指定之人；未指定者，歸屬於亡者之遺產。'] },
  ]},
  { ch: '在世者之保護', arts: [
    { t: '禁止誘導依賴', p: ['維運業者不得以延長使用時間或增加消費為目的，設計亡者化身之互動。', '維運業者發現使用人有過度依賴之情形時，應提供警示及心理協助資訊。'] },
    { t: '未成年人之保護', p: ['未成年人成為使用人或拋棄其使用人身分，應經法定代理人同意。'] },
  ]},
  { ch: '安全與終止', arts: [
    { t: '真偽驗證', p: ['維運業者應提供驗證方式，使任何人得隨時確認所互動者是否為經授權之亡者化身。'] },
    { t: '緊急停用', p: ['亡者化身遭盜用、竄改，或違反<a class="xref" href="#c3" data-to="c3">第三章</a>規定者，化身監護人、使用人或主管機關得要求維運業者立即停用；停用原因消滅後，得恢復運作。'] },
    { t: '存續期間屆滿', p: ['亡者化身之存續期間屆滿者，維運業者應予除籍。'] },
    { t: '服務終止', p: ['維運業者停止服務者，應於一百八十日前通知化身監護人及使用人，並依決定書將亡者化身移轉至其他維運業者，或交由主管機關封存，或予以除籍；決定書未規定者，由化身監護人決定之。'] },
    { t: '欠費之處理', p: ['維護費用未繳者，維運業者得依決定書所定之維護順位縮減亡者化身，或予以封存，但不得逕行除籍。', '封存期間繳清費用者，亡者化身恢復運作；封存逾五年者，交由主管機關封存。'] },
    { t: '主管機關封存之亡者化身', p: [`交由主管機關封存之亡者化身，化身監護人得於封存之日起五年內，申請移轉至維運業者或除籍；逾期未申請者，由主管機關依${x(13)}規定處理或予以除籍。`] },
    { t: '告別之機會', p: ['亡者化身除籍或封存前，維運業者或主管機關應給予使用人告別之機會。'] },
  ]},
];

/* 條次連號 */
let n = 0;
LAW.forEach((c, ci) => { c.no = ci + 1; c.first = n + 1; c.arts.forEach(a => a.no = ++n); c.last = n; });
const TOTAL = n;
const ALL = LAW.flatMap(c => c.arts.map(a => ({ ...a, ch: c.no })));

/* ---------- 內文 ---------- */
const nl = items => '<div class="nlist">' + items.map((t, i) =>
  `<div class="ni"><span class="nm">${CN[i + 1]}、</span><span class="nt">${t}</span></div>`).join('') + '</div>';
const multi = a => a.p.length + (a.after ? 1 : 0) > 1;   // 多項者標示項次
const para = (t, i, a) => multi(a) ? `<p class="para"><span class="pn">${pad2(i + 1)}</span><span>${t}</span></p>` : `<p>${t}</p>`;

function artHTML(a) {
  let h = '';
  a.p.forEach((t, i) => {
    h += para(t, i, a);
    if (a.ol && i === a.p.length - 1) h += nl(a.ol);
  });
  if (a.after) h += para(a.after, a.p.length, a).replace('<p', '<p data-after');
  return `<article class="card" id="a${a.no}"><span class="art-label">第${CN[a.no]}條</span><h3>${a.t}</h3>${h}</article>`;
}

document.getElementById('page').innerHTML = `
  <div class="doc-head" id="top">
    <h2>身後化身管理條例</h2>
    <p class="en">Posthumous AI Avatar Governance Act</p>
  </div>
  ${LAW.map(c => `
    <section class="chapter" data-ch="${c.no}">
      <header class="ph" id="c${c.no}"><span class="ph-no">${pad2(c.no)}</span><h2><span class="ch-no">第${CN[c.no]}章</span>${c.ch}</h2></header>
      ${c.arts.map(artHTML).join('')}
    </section>`).join('')}
  <div class="doc-foot"><span>數位化身除籍局　·　身後化身管理條例</span><button class="btn" data-top="1"><span class="tri-u"></span>回到頂端</button></div>`;

/* ---------- 目錄 ---------- */
document.getElementById('toc').innerHTML = '<ul class="steps">' + LAW.map(c => `
  <li data-ch="${c.no}">
    <button class="item" data-to="c${c.no}"><span class="dot"></span><span class="num">${pad2(c.no)}</span><span class="ttl">${c.ch}</span><span class="tag">${c.first}–${c.last}</span></button>
    <ul class="sub">${c.arts.map(a => `<li><button class="item" data-to="a${a.no}" data-art="${a.no}"><span class="n">${a.no}</span><span class="ttl">${a.t}</span></button></li>`).join('')}</ul>
  </li>`).join('') + '</ul>';

/* ---------- 捲動：目錄同步、進度 ---------- */
const main = document.getElementById('main');
const arts = [...document.querySelectorAll('article.card')];
let lastArt = -1;
function onScroll() {
  const top = main.getBoundingClientRect().top + 140;
  let cur = 0;
  for (let i = 0; i < arts.length; i++) { if (arts[i].getBoundingClientRect().top <= top) cur = i; else break; }
  const atEnd = main.scrollTop + main.clientHeight >= main.scrollHeight - 4;
  if (atEnd) cur = arts.length - 1;
  const started = main.scrollTop > 40;
  const max = main.scrollHeight - main.clientHeight;
  document.getElementById('progBar').style.width = (max > 0 ? Math.round(main.scrollTop / max * 100) : 0) + '%';
  document.getElementById('progLabel').innerHTML = started ? `第 <b>${pad2(cur + 1)}</b> / ${pad2(TOTAL)} 條` : `共 <b>${pad2(TOTAL)}</b> 條`;
  const key = started ? cur : -1;
  if (key === lastArt) return;
  lastArt = key;
  const a = ALL[cur];
  document.querySelectorAll('.toc .steps > li').forEach(li => {
    const ch = +li.dataset.ch, btn = li.firstElementChild;
    btn.classList.toggle('current', started && ch === a.ch);
    btn.classList.toggle('done', started && ch < a.ch);
    li.classList.toggle('open', started && ch === a.ch);
  });
  document.querySelectorAll('.toc .sub .item').forEach(b => b.classList.toggle('inview', started && +b.dataset.art === a.no));
  const iv = document.querySelector('.toc .sub .item.inview');
  if (iv) { const t = document.getElementById('toc'), r = iv.getBoundingClientRect(), tr = t.getBoundingClientRect();
            if (r.top < tr.top + 40 || r.bottom > tr.bottom - 40) t.scrollTop += r.top - tr.top - tr.height / 2; }
}
main.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(onScroll);
onScroll();

/* ---------- 點擊：目錄、條次參照、回到頂端 ---------- */
function goTo(id, flash) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (flash && el.matches('article')) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  history.replaceState(null, '', '#' + id);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-to],[data-top]');
  if (!t) return;
  e.preventDefault();
  if (t.dataset.top) { main.scrollTo({ top: 0, behavior: 'smooth' }); history.replaceState(null, '', location.pathname + location.search); return; }
  goTo(t.dataset.to, t.matches('a.xref'));
});
/* 網址帶 #a13、#c3 時直接定位 */
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) { main.style.scrollBehavior = 'auto'; el.scrollIntoView(); main.style.scrollBehavior = ''; } }
</script>
</body>
</html>
